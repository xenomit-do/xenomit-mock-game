[package]
name = "xenomit-mock-game"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Mock DarkOrbit Backpage + game server + forward proxy for bot tests and benchmarks"

[lib]
name = "xenomit_mock_game"
path = "src/lib.rs"

[[bin]]
name = "xenomit-mock-game"
path = "src/main.rs"

[[bin]]
name = "mock-proxy"
path = "src/bin/mock_proxy.rs"

[dependencies]
xenomit-packet-client = { git = "https://github.com/xenomit-do/xenomit-packet-client", tag = "v0.1.0" }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
xenomit_backpage = { git = "https://github.com/xenomit-do/xenomit-backpage", tag = "v0.1.0" }
xenomit-packet-client = { git = "https://github.com/xenomit-do/xenomit-packet-client", tag = "v0.1.0", features = ["game-api"] }
xenomit-game-api = { git = "https://github.com/xenomit-do/xenomit-game-api", tag = "v0.1.0" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }
